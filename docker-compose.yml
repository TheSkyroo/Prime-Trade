version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: primetrade_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: primetrade
      POSTGRES_PASSWORD: primetrade_secret
      POSTGRES_DB: appdb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U primetrade -d appdb']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: primetrade_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://primetrade:primetrade_secret@postgres:5432/appdb
      JWT_ACCESS_SECRET: super_secret_access_key_change_in_production_32chars
      JWT_REFRESH_SECRET: super_secret_refresh_key_change_in_production_32chars
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '5000:5000'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: primetrade_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  postgres_data:
